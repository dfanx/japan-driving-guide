<svg aria-labelledby="D011-title D011-description" data-diagram-id="D011" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><title id="D011-title">Side A is a local road without a centre line and shows the 30 km/h rule from 2026-09-01 when no other limit is posted; side B has a centre line and prompts the driver to read the posted limit.</title><desc id="D011-description">Side A is a local road without a centre line and shows the 30 km/h rule from 2026-09-01 when no other limit is posted; side B has a centre line and prompts the driver to read the posted limit.</desc><rect data-primitive="canvas" fill="#dbe7eb" height="800" width="1200" x="0" y="0"/><g data-composition="road_comparison" data-template="C02"><g data-effective-limit="30-from-2026-09-01-unless-posted" data-road-type="no-centre-line"><rect data-primitive="road-segment" fill="#53616a" height="800" rx="0" width="320" x="120" y="0"/><g data-color="yellow" data-heading="north" data-primitive="vehicle"><g><rect fill="#e5b436" height="100" rx="11.52" stroke="#20282d" stroke-width="3" width="64" x="205" y="520"/><rect fill="#d8e8ed" height="20" rx="5.12" width="43.52" x="215.24" y="536"/></g><g data-primitive="label-badge"><circle cx="237" cy="570" fill="#315f78" r="23.04"/><text dominant-baseline="central" fill="#f7fbfc" font-family="system-ui, sans-serif" font-size="36.864" font-weight="700" text-anchor="middle" x="237" y="570">A</text></g></g><rect data-representation="teaching-label-not-road-sign" fill="#ffffff" height="150" rx="18" stroke="#20282d" stroke-width="6" width="280" x="140" y="65"/><text fill="#20282d" font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle" x="280" y="125">A 無中央線｜9·1 起</text><text fill="#20282d" font-family="system-ui, sans-serif" font-size="30" font-weight="800" text-anchor="middle" x="280" y="180">無另標：30 km/h</text></g><g data-action="read-posted-limit" data-road-type="centre-line"><rect data-primitive="road-segment" fill="#53616a" height="800" rx="0" width="400" x="680" y="0"/><line data-primitive="lane-boundary" stroke="#f7fafb" stroke-linecap="butt" stroke-width="7" x1="880" x2="880" y1="6" y2="794"/><g data-color="blue" data-heading="north" data-primitive="vehicle"><g><rect fill="#3f85a3" height="100" rx="11.52" stroke="#20282d" stroke-width="3" width="64" x="760" y="520"/><rect fill="#d8e8ed" height="20" rx="5.12" width="43.52" x="770.24" y="536"/></g><g data-primitive="label-badge"><circle cx="792" cy="570" fill="#315f78" r="23.04"/><text dominant-baseline="central" fill="#f7fbfc" font-family="system-ui, sans-serif" font-size="36.864" font-weight="700" text-anchor="middle" x="792" y="570">B</text></g></g><rect data-representation="teaching-label-not-road-sign" fill="#ffffff" height="150" rx="18" stroke="#20282d" stroke-width="6" width="340" x="710" y="65"/><text fill="#20282d" font-family="system-ui, sans-serif" font-size="38" font-weight="800" text-anchor="middle" x="880" y="125">B  有中央線</text><text fill="#20282d" font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle" x="880" y="180">看現場速限</text></g></g></svg>
