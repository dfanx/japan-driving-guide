name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install hermetic browser
        run: npm run install:browsers
      - name: Resolve Pages base path
        id: base
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" == "$GITHUB_REPOSITORY_OWNER/$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify source
        run: npm run lint && npm run typecheck && npm run test
      - name: Build Pages artifact
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Verify base-path output
        run: npm run check:base-path && npm run check:pwa
        env:
          SITE_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Smoke test Pages artifact
        run: npm run test:e2e:f022
        env:
          TEST_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
