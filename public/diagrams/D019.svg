<svg aria-labelledby="D019-title D019-description" data-diagram-id="D019" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><title id="D019-title">A solid yellow roadside line prohibits stopping and parking; a broken yellow line prohibits parking.</title><desc id="D019-description">A solid yellow roadside line prohibits stopping and parking; a broken yellow line prohibits parking.</desc><rect data-primitive="canvas" fill="#dbe7eb" height="800" width="1200" x="0" y="0"/><g data-composition="parking_roadside" data-template="T09"><g data-roadside-marking="yellow-solid"><rect data-primitive="road-segment" fill="#53616a" height="560" rx="0" width="400" x="100" y="120"/><line stroke="#f0b800" stroke-width="18" x1="154" x2="154" y1="150" y2="650"/><g data-color="yellow" data-heading="north" data-primitive="vehicle"><g><rect fill="#e5b436" height="100" rx="11.52" stroke="#20282d" stroke-width="3" width="64" x="205" y="450"/><rect fill="#d8e8ed" height="20" rx="5.12" width="43.52" x="215.24" y="466"/></g><g data-primitive="label-badge"><circle cx="237" cy="500" fill="#315f78" r="23.04"/><text dominant-baseline="central" fill="#f7fbfc" font-family="system-ui, sans-serif" font-size="36.864" font-weight="700" text-anchor="middle" x="237" y="500">A</text></g></g><rect data-representation="teaching-label-not-road-sign" fill="#ffffff" height="120" rx="16" stroke="#20282d" stroke-width="4" width="340" x="130" y="15"/><text fill="#20282d" font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle" x="300" y="65">黃色實線</text><text fill="#20282d" font-family="system-ui, sans-serif" font-size="27" font-weight="800" text-anchor="middle" x="300" y="108">駐車＋臨時停車禁止</text><g data-primitive="error-mark"><line stroke="#d64242" stroke-linecap="round" stroke-width="14" x1="380" x2="440" y1="570" y2="630"/><line stroke="#d64242" stroke-linecap="round" stroke-width="14" x1="380" x2="440" y1="630" y2="570"/></g></g